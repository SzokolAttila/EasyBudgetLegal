<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBudget – Legal</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1b1f1d; --muted: #5f6b66; --accent: #2e7d5b; --line: #dde3e0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --fg: #e6ebe8; --muted: #9aa8a1; --accent: #6fcf9f; --line: #2b332f; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
nav { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }
nav a {
  color: var(--accent); text-decoration: none; padding: 4px 12px;
  border: 1px solid var(--line); border-radius: 999px; font-size: 14px;
}
h1 { font-size: 1.8rem; line-height: 1.25; margin: 8px 0 4px; }
h2 { font-size: 1.1rem; margin: 32px 0 8px; }
.meta { color: var(--muted); margin-top: 0; }
ul { padding-left: 1.4em; }
li { margin-bottom: 4px; }
a { color: var(--accent); }
/* Language switch without JavaScript: English by default, Hungarian at #hu. */
#hu { display: none; }
#hu:target { display: block; }
#hu:target ~ #en { display: none; }
</style>
</head>

</body>
</html>
